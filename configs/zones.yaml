# Operator-defined danger zones. Polygons are normalized [0,1] so they survive resize.
# Edit interactively in the Streamlit demo, or version controlled here for a fixed camera.
# severity: info | warning | critical
zones:
  - name: "Зона у пресса"
    severity: critical
    requires: [hardhat]
    polygon:
      - [0.05, 0.45]
      - [0.45, 0.45]
      - [0.45, 0.95]
      - [0.05, 0.95]
  - name: "Проход"
    severity: warning
    requires: [hardhat]
    polygon:
      - [0.55, 0.40]
      - [0.95, 0.40]
      - [0.95, 0.95]
      - [0.55, 0.95]
